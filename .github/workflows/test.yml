name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      # Don't add --ignore-scripts: a GitHub dependency compiles itself on install.
      - run: npm ci
      - run: npm run update:build-id
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npx jest --ci

  e2e:
    # Pin the supported runner instead of following ubuntu-latest changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npm run update:build-id
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        env:
          DEBUG: pw:install
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  backup-browsers:
    name: Backup (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - name: Install backup-test browser
        timeout-minutes: 5
        env:
          DEBUG: pw:install
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test saved files, interruption, restore and rollback
        env:
          E2E_ALL_BROWSERS: '1'
        run: >-
          npx playwright test e2e/backupHandoff.spec.ts
          e2e/backupPage.spec.ts
          e2e/freshBackupRestore.spec.ts
          e2e/recoverableBackup.spec.ts e2e/libraryRecovery.spec.ts
          e2e/databaseRoundtrip.spec.ts --project=${{ matrix.browser }} --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backup-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image from clean source
        run: docker build --tag artbot:ci .
      - name: Check native image processing
        run: |
          docker run --rm --entrypoint node artbot:ci -e '
            require("sharp")({
              create: { width: 8, height: 8, channels: 3, background: "blue" }
            }).png().toBuffer().then(bytes => {
              if (!bytes.length) throw new Error("No PNG output")
            }).catch(error => { console.error(error); process.exit(1) })
          '
      - name: Check production startup and generated build metadata
        run: |
          docker run --detach --name artbot-ci artbot:ci
          docker exec -i artbot-ci node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { setTimeout } from 'node:timers/promises'
          const expected = JSON.parse(readFileSync('build_info.json', 'utf8')).build
          assert.match(expected, /^\d{12}$/)
          let lastError
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:3000/artbot/api/server-info', {
                signal: AbortSignal.timeout(2000)
              })
              assert.equal(response.status, 200)
              assert.equal((await response.json()).build, expected)
              process.exit(0)
            } catch (error) {
              lastError = error
              await setTimeout(1000)
            }
          }
          throw lastError
          JS
      - name: Show failed container logs
        if: failure()
        run: docker logs artbot-ci
      - name: Remove test container
        if: always()
        run: docker rm --force artbot-ci || true
